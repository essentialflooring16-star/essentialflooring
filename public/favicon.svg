<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The two planks from the client's own logo, cream over copper, on the
       anthracite his brand card uses. Same angle and same tight gap as the
       lockup in src/components/BrandLogo.astro, so the tab icon, the preview
       card and the header all carry one mark. Colours sampled from his file:
       ground #25292C, cream #EFECE3, copper #B5773A. -->
  <rect width="64" height="64" rx="6" fill="#25292C"/>
  <g transform="rotate(-19 32 32)">
    <rect x="7" y="21" width="40" height="8.5" fill="#EFECE3"/>
    <rect x="17" y="32.5" width="40" height="8.5" fill="#B5773A"/>
  </g>
</svg>
